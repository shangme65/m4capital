name: Process Mining Earnings (Daily)

on:
  schedule:
    # Runs every day at 00:05 UTC (5 minutes after Vercel cron as a fallback)
    - cron: "5 0 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  process-mining-earnings:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
    steps:
      - name: Trigger Mining Earnings Cron
        run: |
          APP_URL="$NEXTAUTH_URL"

          if [ -z "$APP_URL" ]; then
            echo "❌ Missing app URL. Configure secrets.NEXTAUTH_URL"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "❌ Missing CRON secret. Configure secrets.CRON_SECRET"
            exit 1
          fi

          HTTP_STATUS=$(curl -sS -L --connect-timeout 10 --max-time 30 \
            -o /tmp/response.txt -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/process-mining-earnings" || true)

          echo "Response body:"
          if [ -f /tmp/response.txt ]; then
            cat /tmp/response.txt
          else
            echo "(empty response)"
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Mining earnings processed successfully (HTTP $HTTP_STATUS)"
          else
            echo "❌ Mining earnings cron failed (HTTP $HTTP_STATUS)"
            echo "Target URL: $APP_URL/api/cron/process-mining-earnings"
            exit 1
          fi
