name: Monitor Copy Trades (Every 5 Min)

on:
  schedule:
    # Runs every 5 minutes — GitHub Actions has no frequency limit
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  monitor-copy-trades:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
    steps:
      - name: Trigger Copy Trade Monitor
        run: |
          APP_URL="$NEXTAUTH_URL"

          if [ -z "$APP_URL" ]; then
            echo "❌ Missing app URL. Configure secrets.NEXTAUTH_URL"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "❌ Missing CRON secret. Configure secrets.CRON_SECRET"
            exit 1
          fi

          HTTP_STATUS=$(curl -sS -L --connect-timeout 10 --max-time 30 \
            -o /tmp/response.txt -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/monitor-copy-trades" || true)

          echo "Response body:"
          if [ -f /tmp/response.txt ]; then
            cat /tmp/response.txt
          else
            echo "(empty response)"
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Copy trade monitor ran successfully (HTTP $HTTP_STATUS)"
          else
            echo "❌ Copy trade monitor failed (HTTP $HTTP_STATUS)"
            echo "Target URL: $APP_URL/api/cron/monitor-copy-trades"
            exit 1
          fi
